language = "C"
include_guard = "NETCORE_FFI_H"
autogen_warning = "/* generated by cbindgen from core-rs/core-ffi, do not edit */"
cpp_compat = true
usize_is_size_t = true
sys_includes = ["stdint.h", "stddef.h"]
no_includes = true

[export]
include = ["NcStatus", "NcAlertSource", "NcSeverity", "NcCaptureState", "NcScenario", "NcAnalyticsState"]
exclude = [
  "Device", "Opaque", "Frame", "Stats", "Callback", "ALERT_QUEUE_CAPACITY",
  "sniffer_list_devices", "sniffer_open_live", "sniffer_open_file", "sniffer_set_callback",
  "sniffer_set_realtime", "sniffer_start", "sniffer_stop", "sniffer_poll_finished", "sniffer_link_type",
  "sniffer_get_stats", "sniffer_last_error", "sniffer_close",
]

[enum]
prefix_with_name = true
rename_variants = "ScreamingSnakeCase"

[parse]
parse_deps = false
